version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: civicpulse-mysql
    environment:
      MYSQL_DATABASE: civicpulse
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  backend:
    build: ./backend
    container_name: civicpulse-backend
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/civicpulse?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""

  frontend:
    build: ./frontend
    container_name: civicpulse-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
